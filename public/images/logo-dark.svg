<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" fill="none">
  <defs>
    <!-- Squircle Surface Gradient (Identical Brand Emblem Geometry) -->
    <linearGradient id="itBadgeBgDark" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2F23" />
      <stop offset="55%" stop-color="#142018" />
      <stop offset="100%" stop-color="#0D1510" />
    </linearGradient>

    <!-- Squircle Rim Highlight -->
    <linearGradient id="itBadgeRimDark" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6FF54" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#9CE840" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#388E18" stop-opacity="0.55" />
    </linearGradient>

    <!-- Primary Luminous Lime Face -->
    <linearGradient id="itLimeFaceDark" x1="14" y1="12" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8FF68" />
      <stop offset="45%" stop-color="#9CE840" />
      <stop offset="100%" stop-color="#6AC21C" />
    </linearGradient>

    <!-- 3D Isometric Emerald Extrusion Facet -->
    <linearGradient id="itEmeraldDepthDark" x1="18" y1="24" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3EB42C" />
      <stop offset="100%" stop-color="#187A20" />
    </linearGradient>

    <!-- Soft Drop Shadow inside Squircle -->
    <filter id="itMarkShadowDark" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#040805" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. Unified Emblem Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#itBadgeBgDark)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="14.25" stroke="url(#itBadgeRimDark)" stroke-width="1.5" />

  <!-- 2. Isometric 3D Mortarboard + Upward Verified Trajectory Mark (100% Identical Geometry) -->
  <g filter="url(#itMarkShadowDark)">
    <!-- Academic Cap Top Diamond -->
    <path d="M32 12.5L49 20.5L32 28.5L15 20.5L32 12.5Z" fill="url(#itLimeFaceDark)" />
    <!-- Cap Left Tassel -->
    <path d="M18.2 22V31.5" stroke="#A6F244" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="18.2" cy="32" r="1.8" fill="#C4FF62" />

    <!-- Isometric Cap Base (Left Light Facet + Right Emerald Facet) -->
    <path d="M23 25.8L32 30V37.2C29.1 34.4 26.1 33 23 32.4V25.8Z" fill="#98E63B" />
    <path d="M41 25.8L32 30V37.2L41 29.2V25.8Z" fill="url(#itEmeraldDepthDark)" />

    <!-- 3D Extruded Verification Check-Arrow (Bottom Depth Layer) -->
    <path d="M22.5 37.5L32 47L45.5 33.5L48.5 36.5L51.5 26L41 29L44 32L32 44L26.5 38.5L22.5 37.5Z" fill="url(#itEmeraldDepthDark)" transform="translate(0, 3.2)" />

    <!-- 3D Extruded Verification Check-Arrow (Top Luminous Lime Layer) -->
    <path d="M22.5 37.5H27.2L32 42.3L43.2 31.1L40.2 28.1L51.5 25.8L49.2 37.1L46.2 34.1L32 48.3L22.5 37.5Z" fill="url(#itLimeFaceDark)" />
  </g>

  <!-- 3. Wordmark (Dark Mode Surface) -->
  <text x="72" y="39" font-family="'Plus Jakarta Sans', 'Inter Tight', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.03em" fill="#F4F9F5">
    Intern<tspan fill="#9CE840">Track</tspan>
  </text>
  <rect x="214" y="21" width="34" height="18" rx="5" fill="#1D2E1A" stroke="#9CE840" stroke-opacity="0.55" stroke-width="1" />
  <text x="231" y="33.5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.06em" fill="#9CE840">PRO</text>
</svg>
